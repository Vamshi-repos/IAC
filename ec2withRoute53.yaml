---
- name: Provosioning computing instanes for dev env
  hosts: all
  connection: local
  become: true

  vars:
    security_group: sg-083446db6257302fd
    vpc_subnet_id: subnet-0180d5b418f80a11c
    ami_id: ami-0b6d9d3d33ba97d99
    env: dev
    instances:
       - mongodb
       - catalog
    domain_name: roboshop.online

  tasks:
  - name: Launch an EC2 instance with a public IP address
    amazon.aws.ec2_instance:
      name: "{{ item }} - {{ env }}"
      key_name: sshkeypair
      vpc_subnet_id: "{{ vpc_subnet_id }}"
      instance_type: t3.micro
      security_group: "{{ security_group }}"
      region: us-east-1 
      network:
        assign_public_ip: true
      image_id: "{{ ami_id }}"
      tags:
        Project: roboshop
        component: "{{ item }}"
        environment: "{{ env }}"
        name: "{{ item }} - {{ env }}"
    loop: "{{ instances }}"
    register: ec2_output
    when: action == 'create'

  - name: print the output
    ansible.builtin.debug:
      msg: "{{ ec2_output }}"
    when: action == 'create'
    
  - name: creating route53 record for the instances
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ item.item }}-{{ env }}.{{ domain_name }}"
      type: A
      ttl: 1
      value: "{{ item.instances[0].public_ip_address }}"
      wait: true
    loop: "{{ ec2_output.results }}"
    when: action == 'create'