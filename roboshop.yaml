---
- name: Provosioning computing instanes for dev env
  hosts: all
  connection: local
  become: true

  vars:
    security_group: sg-083446db6257302fd
    vpc_subnet_id: subnet-0180d5b418f80a11c
    ami_id: ami-0b6d9d3d33ba97d99
    env: dev
    instances:
       - mongodb
       - catalog

  tasks:
  - name: Launch an EC2 instance with a public IP address
    amazon.aws.ec2_instance:
      name: "{{ item }} - {{ env }}"
      key_name: sshkeypair
      vpc_subnet_id: "{{ vpc_subnet_id }}"
      instance_type: t3.micro
      security_group: "{{ security_group }}"
      region: us-east-1 
      network:
        assign_public_ip: true
      image_id: "{{ ami_id }}"
      tags:
        Project: roboshop
        component: "{{ item }}"
        environment: "{{ env }}"
        name: "{{ item }} - {{ env }}"
    loop: "{{ instances }}"
    register: ec2_output

  - name: print the output
    ansible.builtin.debug:
      msg: "{{ ec2_output }}"

  - name: Display instance IPs
    ansible.builtin.debug:
     msg:
      - "Component: {{ item.item }}"
      - "Private IP: {{ item.instances[0].private_ip_address }}"
      - "Public IP: {{ item.instances[0].public_ip_address }}"
  loop: "{{ ec2_output.results }}"